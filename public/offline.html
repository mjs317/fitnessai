<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0A0A0A;
      color: #F5F5F5;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      padding: 20px;

      font-size: 24px;
      color: #F5F5F5;
      margin-bottom: 12px;

  <div>
